services:
  - type: web
    name: crud-flask-reserva-temporal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: reserva_boletos
      - key: RESERVA_SEGUNDOS
        value: 60
